<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Form</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
      }

      .main {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
      }
      .login-form {
        width: 300px;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div class="main">
      <form
        class="login-form"
        style="background-color: red; padding: 20px; border-radius: 5px"
      >
        <h1>Login</h1>
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required /><br /><br />

        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          name="password"
          required
        /><br /><br />

        <input type="submit" value="Login" />
      </form>
    </div>
  </body>
</html>
